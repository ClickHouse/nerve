version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    # Runs on the first day of each month. Security updates do not use this
    # schedule.
    schedule:
      interval: "monthly"
    # Do not propose a release until it is 7 days old. Malicious releases
    # (account takeover, typosquat) are usually found and yanked within days.
    # Cooldown applies to version updates only, so security updates are not
    # delayed.
    cooldown:
      default-days: 7
    # uv.lock is what gets installed, and most of its pins are transitive.
    # The default ("direct") would leave those pins to go stale.
    allow:
      - dependency-type: "all"
    # Change uv.lock only, and never pyproject.toml. A floor in pyproject.toml
    # is the oldest version that nerve accepts. uv.lock sets the version that
    # is installed and tested. Do not use "increase-if-necessary": the uv
    # updater raises a floor also when the range already allows the new
    # version (dependabot-core#14908).
    # Dependabot proposes no update that needs a new bound in pyproject.toml.
    # This applies to each exact pin and upper bound, for example
    # memu-py==1.4.0, mcp<3 and the hatchling build requirement. A person
    # examines each such update and changes the bound by hand. Security
    # updates have the same limit: when the fix is outside a bound,
    # Dependabot opens no PR and the alert stays open.
    versioning-strategy: "lockfile-only"
    # One PR for all minor and patch updates. Each major update gets its own
    # PR. These packages also get their own PR, because each update needs a
    # manual check:
    # - memu-py: nerve monkey-patches its internals
    #   (memu_bridge._patch_sqlite_bugs). The exact pin stops all Dependabot
    #   updates for it. This exclusion keeps it out of the group if the pin
    #   becomes a range.
    # - claude-agent-sdk: the wheel bundles the Claude CLI that runs every
    #   agent turn, and CI does not run the real CLI.
    groups:
      python-minor-patch:
        update-types:
          - "minor"
          - "patch"
        exclude-patterns:
          - "memu-py"
          - "claude-agent-sdk"

  - package-ecosystem: "npm"
    directory: "/web"
    # Runs on the first day of each month. Security updates do not use this
    # schedule.
    schedule:
      interval: "monthly"
    # Do not propose a release until it is 7 days old. See the uv entry.
    cooldown:
      default-days: 7
    # Change package.json only when the new version is outside its range. An
    # update inside a "^" or "~" range changes package-lock.json only, so the
    # package.json diff shows the updates that leave a declared range: majors,
    # 0.x minors and exact pins such as @clickhouse/click-ui. The default for
    # an app raises the floor of each updated range. "lockfile-only" would
    # stop all major updates, because a major is outside each "^" or "~"
    # range.
    versioning-strategy: "increase-if-necessary"
    # Hold TypeScript below 7. typescript-eslint accepts TypeScript below 6.1
    # only, and CI installs with --strict-peer-deps. Remove this rule when a
    # typescript-eslint release accepts TypeScript 7.
    ignore:
      - dependency-name: "typescript"
        versions: [">=7.0.0"]
    # A dependency goes into the first group that it matches. A group with no
    # update-types also takes major updates.
    groups:
      # @eslint/js needs the eslint of the same major (peer dependency), so
      # the two update in one PR.
      eslint:
        patterns:
          - "eslint"
          - "@eslint/js"
      # @vitest/coverage-v8 needs the same vitest version (peer dependency).
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      # One PR for all other minor and patch updates. Each other major update
      # gets its own PR. @clickhouse/click-ui also gets its own PR: its 0.x
      # minors can change the UI, and CI does not check styles (Vitest runs
      # with css: false).
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
        exclude-patterns:
          - "@clickhouse/click-ui"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
