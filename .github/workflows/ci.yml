name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same branch/PR (e.g. rapid pushes).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # The suite finishes in ~1 minute; a hang should fail fast instead of
    # burning the 6h default (bit us on 2026-07-27: a test awaiting a task
    # on a dead TestClient portal loop parked two runs for 6h each).
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Matches pyproject's requires-python floor of >=3.13, which is set by
        # the pinned memu-py==1.4.0. Add more versions here if that pin is ever
        # relaxed and the floor drops.
        python-version: ["3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          # Pinned deliberately. uv owns the lockfile format (uv.lock records a
          # `version` and `revision`) and it is also the tool asserting the lock
          # is current, so letting CI float to whatever uv shipped this morning
          # puts a moving part underneath the reproducibility this file exists to
          # provide. Bump this alongside a `uv lock` refresh.
          version: "0.12.0"
          enable-cache: true
          # uv.lock is the single input that determines the resolution.
          cache-dependency-glob: "uv.lock"

      - name: Install project and test dependencies
        # `uv sync` resolves from uv.lock, creates .venv, and installs the
        # project editable — so this run gets the same versions today and in six
        # months. It also stops the cache deciding versions: before the lock, a
        # restored cache carrying stale index metadata was the only reason CI
        # kept resolving mcp 1.29.0 for three weeks after mcp 2.0.0 had broken
        # every fresh install (#316).
        #
        # --locked asserts uv.lock is already in sync with pyproject.toml and
        # fails if not, rather than silently re-locking. That is what makes this
        # one job sufficient: any dependency change — added, removed, or
        # re-bounded — invalidates the lock, so it cannot be merged without a
        # relock, and the relock moves the pins that this job then tests. It
        # does NOT fail merely because upstream published something new, since
        # the lock is used as-is.
        run: uv sync --extra test --locked --python ${{ matrix.python-version }}

      - name: Run test suite
        run: .venv/bin/pytest tests/ -v

  slack-live-tests:
    name: Slack live integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The constraint is forks, not pull requests: a fork cannot read the
    # secrets, so the job would have nothing to run against. A pull request
    # from a branch in this repository can, and is exactly where the result
    # is worth having — waiting until merge means finding out too late.
    #
    # A clone without the secrets configured skips every test rather than
    # failing, so this stays green outside ClickHouse/nerve.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          # Kept in step with the backend job above; bump both together.
          version: "0.12.0"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install project and test dependencies
        run: uv sync --extra test --locked --python "3.13"

      # Inbound first, and in its own process. The outbound tests post,
      # react and upload for a minute with no socket listening, so Slack
      # queues all of it and replays the backlog to the next connection that
      # appears. Running them first put every inbound event behind that
      # queue: messages arrived a whole test late. Order matters as much as
      # the process split. `if: always()` so a failure in the first still
      # reports the second rather than hiding it.
      - name: Run live Slack tests (inbound)
        env:
          NERVE_SLACK_TEST_BOT_TOKEN: ${{ secrets.NERVE_SLACK_TEST_BOT_TOKEN }}
          NERVE_SLACK_TEST_APP_TOKEN: ${{ secrets.NERVE_SLACK_TEST_APP_TOKEN }}
          NERVE_SLACK_TEST_CHANNEL: ${{ secrets.NERVE_SLACK_TEST_CHANNEL }}
          NERVE_SLACK_TEST_USER_TOKEN: ${{ secrets.NERVE_SLACK_TEST_USER_TOKEN }}
        run: .venv/bin/pytest tests/test_slack_live_inbound.py -v

      - name: Run live Slack tests (outbound)
        if: always()
        env:
          NERVE_SLACK_TEST_BOT_TOKEN: ${{ secrets.NERVE_SLACK_TEST_BOT_TOKEN }}
          NERVE_SLACK_TEST_APP_TOKEN: ${{ secrets.NERVE_SLACK_TEST_APP_TOKEN }}
          NERVE_SLACK_TEST_CHANNEL: ${{ secrets.NERVE_SLACK_TEST_CHANNEL }}
          NERVE_SLACK_TEST_USER_TOKEN: ${{ secrets.NERVE_SLACK_TEST_USER_TOKEN }}
          NERVE_SLACK_TEST_BOT_TOKEN_NO_EMAIL: ${{ secrets.NERVE_SLACK_TEST_BOT_TOKEN_NO_EMAIL }}
        run: .venv/bin/pytest tests/test_slack_live.py -v

  frontend-build:
    name: Frontend build (Vite)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend (tsc -b && vite build)
        run: npm run build

      - name: Run test suite (Vitest)
        run: npm test
